<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>{{ titulo }} — Jean Barber Atelier</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #0b1326; color: #dae2fd; font-family: Geist, -apple-system, sans-serif; padding: 24px; box-sizing: border-box; }
    .card { max-width: 360px; text-align: center; background: #171f33; border-radius: 16px; padding: 32px 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
    .icon { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 20px; margin: 0 0 8px; color: {{ color|default:"#ffc174" }}; }
    p { font-size: 14px; color: #d8c3ad; line-height: 1.5; }
    a { display: inline-block; margin-top: 20px; background: #ffc174; color: #472a00; font-weight: 700;
        text-decoration: none; padding: 12px 20px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">{{ icono|default:"💈" }}</div>
    <h1>{{ titulo }}</h1>
    <p>{{ mensaje }}</p>
    <a href="/app/citas/">Ver mis citas</a>
  </div>
</body>
</html>
