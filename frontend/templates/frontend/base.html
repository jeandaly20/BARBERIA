{% load static %}<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>{% block title %}Jean Barber Atelier{% endblock %}</title>

  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;family=Syne:wght@100..900&amp;display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="{% static 'frontend/css/base.css' %}"/>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="{% static 'frontend/js/tailwind-config.js' %}"></script>

  {% block extra_head %}{% endblock %}
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface min-h-screen flex flex-col pt-safe pb-safe">

{% block header %}{% endblock %}

<main class="flex-1 flex flex-col relative w-full bg-surface min-h-screen{% block main_extra_classes %}{% endblock %}">
  {% block content %}{% endblock %}
</main>

{% block bottom_nav %}{% endblock %}

<script src="{% static 'frontend/js/api.js' %}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
